<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaboJoy</title>
<meta name="description" content="LaboJoy, studio de jeux mobiles.">
<style>
  :root { color-scheme: light dark; --fond: #ffffff; --texte: #1d1d1f; --doux: #5f6368; --accent: #1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --fond: #121212; --texte: #f1f1f1; --doux: #a0a0a0; --accent: #8ab4f8; } }
  body { margin: 0; background: var(--fond); color: var(--texte); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  p.sous-titre { margin: 0 0 32px; color: var(--doux); }
  h2 { font-size: 1.15rem; margin: 32px 0 8px; }
  a { color: var(--accent); }
  ul { padding-left: 20px; }
  footer { margin-top: 48px; font-size: .9rem; color: var(--doux); }
</style>
</head>
<body>
<main>
  <h1>LaboJoy</h1>
  <p class="sous-titre">Studio de jeux mobiles · Mobile game studio</p>

  <h2>Nos jeux · Our games</h2>
  <ul>
    <li><a href="https://play.google.com/store/apps/details?id=com.labojoy.myweedshop">My Weed Shop</a> — Google Play</li>
  </ul>

  <h2>Confidentialité · Privacy</h2>
  <p><a href="https://sites.google.com/view/labojoy">Politique de confidentialité · Privacy policy</a></p>

  <footer>LaboJoy — Jérémy Bourguet, entrepreneur individuel · SIREN 900 566 803</footer>
</main>
</body>
</html>
